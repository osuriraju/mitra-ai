<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1015" />
  <title>Offline · Mitra AI</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #0A0B0F; color: #E7E9EE;
      font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 64px; height: 64px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #9AA0AC; font-size: 15px; }
    button { background: #2DD4BF; color: #04110F; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="" />
    <h1>You're offline</h1>
    <p>Mitra needs a connection. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
